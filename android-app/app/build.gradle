plugins { id 'com.android.application' }

android {
    namespace 'com.galaxyyarchive.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.galaxyyarchive.app'
        minSdk 9
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
